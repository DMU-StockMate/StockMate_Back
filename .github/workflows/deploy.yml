name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t stockmate-backend:${{ github.sha }} .

      - name: Stop old container
        run: |
          docker rm -f stockmate-backend || true

      - name: Start new container
        run: |
          docker run -d \
            --name stockmate-backend \
            --restart unless-stopped \
            --env-file /opt/stockmate/.env \
            -p 127.0.0.1:3000:3000 \
            stockmate-backend:${{ github.sha }}

      - name: Remove unused images
        run: |
          docker image prune -f