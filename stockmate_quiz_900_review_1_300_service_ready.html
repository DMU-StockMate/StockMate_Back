<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2937;--muted:#64748b;--line:#dbe2ea;--accent:#2563eb;}
*{box-sizing:border-box} body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}

<script>
const qs=[{"num":1,"level":"초급","category":"주식 기본 개념","category_code":"BEGINNER_STOCK_BASIC","detail_code":"STOCK","question_type":"MULTIPLE_CHOICE","question_text":"주식의 의미로 가장 적절한 것은?","explanation":"주식은 기업의 소유권 일부를 나타내는 증권이다. 주주는 회사 가치 변동에 따른 이익과 손실을 함께 부담한다.","reward":1000,"choices":[{"no":1,"text":"채권","correct":false},{"no":2,"text":"정기예금","correct":false},{"no":3,"text":"배당","correct":false},{"no":4,"text":"기업의 소유권 일부를 나타내는 증권","correct":true}]},{"num":2,"level":"초급","category":"주식 기본 개념","category_code":"BEGINNER_STOCK_BASIC","detail_code":"STOCK","question_type":"MULTIPLE_CHOICE","question_text":"주식과 채권의 가장 큰 차이로 옳은 것은?","explanation":"주식은 상환 의무가 없는 소유 지분이며, 채권은 발행자가 만기에 원금과 이자를 갚기로 약속한 채무 증권이다. 두 상품은 위험과 수익 구조가 근본적으로 다르다.","reward":1000,"choices":[{"no":1,"text":"주식은 기업에 대한 소유 지분이고, 채권은 정해진 이자와 원금 상환을 약속하는 채무 증권이다","correct":true},{"no":2,"text":"주식과 채권 모두 만기에 원금 상환이 보장된다","correct":false},{"no":3,"text":"채권은 주식보다 항상 더 높은 수익률을 낸다","correct":false},{"no":4,"text":"주식은 이자를, 채권은 배당을 지급하는 상품이다","correct":false}]},{"num":3,"level":"초급","category":"주식 기본 개념","category_code":"BEGINNER_STOCK_BASIC","detail_code":"STOCK","question_type":"MULTIPLE_CHOICE","question_text":"주주의 권리와 위험에 대한 설명 중 옳지 않은 것은?","explanation":"기업 청산 시 채권자가 주주보다 우선 변제받고, 주주는 그 이후 남는 재산에 대해서만 권리를 갖는다. 이 때문에 주식은 채권보다 청산 시 회수 순위가 낮다.","reward":1000,"choices":[{"no":1,"text":"주주는 보유 지분만큼 배당을 받을 권리가 있다","correct":false},{"no":2,"text":"주주는 주주총회에서 의결권을 행사할 수 있다","correct":false},{"no":3,"text":"기업이 파산하면 주주는 채권자보다 먼저 잔여재산을 배분받는다","correct":true},{"no":4,"text":"회사 실적이 악화되면 주가 하락에 따른 손실을 감수해야 한다","correct":false}]},{"num":4,"level":"초급","category":"주식 기본 개념","category_code":"BEGINNER_STOCK_BASIC","detail_code":"STOCK","question_type":"OX","question_text":"주식은 기업의 소유권 일부를 나타내는 증권이다.","explanation":"맞다. 주주는 지분율만큼 회사에 대한 소유권을 가지며 그에 따른 이익과 손실을 함께 부담한다.","reward":1000,"choices":[{"no":1,"text":"O","correct":true},{"no":2,"text":"X","correct":false}]},{"num":5,"level":"초급","category":"주식 기본 개념","category_code":"BEGINNER_STOCK_BASIC","detail_code":"STOCK","question_type":"OX","question_text":"주식을 보유하면 회사 실적과 무관하게 매년 일정한 수익이 보장된다.","explanation":"틀리다. 주식은 확정 수익 상품이 아니며 배당과 주가는 기업 실적과 시장 상황에 따라 달라진다.","reward":1000,"choices":[{"no":1,"text":"O","correct":false},{"no":2,"text":"X","correct":true}]},{"num":6,"level":"초급","category":"주식 기본 개념","category_code":"BEGINNER_STOCK_BASIC","detail_code":"STOCK","question_type":"MULTIPLE_CHOICE","question_text":"A씨는 이익을 배당하지 않고 전액 재투자하는 회사의 주식을 보유하고 있다. 가장 적절한 해석은?","explanation":"배당은 기업이 이익을 나누는 방법 중 하나일 뿐이다. 성장기 기업은 이익을 재투자해 기업가치를 높이는 전략을 택하기도 하므로 배당 여부만으로 투자 매력을 판단할 수 없다.","reward":1000,"choices":[{"no":1,"text":"배당이 없어도 이익을 재투자해 기업가치가 높아지면 주가 상승으로 이어질 수 있다","correct":true},{"no":2,"text":"배당이 없는 회사는 투자 가치가 전혀 없다","correct":false},{"no":3,"text":"배당을 주지 않는 회사는 반드시 실적이 나쁘다","correct":false},{"no":4,"text":"배당이 없으면 주주로서 아무 권리도 없다","correct":false}]},{"num":7,"level":"초급","category":"주식 기본 개념","category_code":"BEGINNER_STOCK_BASIC","detail_code":"STOCK","question_type":"MULTIPLE_CHOICE","question_text":"주식 투자를 결정하기 전 추가로 확인하면 좋은 정보로 가장 적절한 것은?","explanation":"재무제표, 산업 동향, 경쟁사와의 비교는 기업의 실질 가치를 판단하는 데 도움이 된다. 단기 등락률이나 비공식적인 추천은 신뢰할 수 있는 판단 근거가 되기 어렵다.","reward":1000,"choices":[{"no":1,"text":"재무제표, 산업 동향, 경쟁사 비교 등 기업 펀더멘털 정보","correct":true},{"no":2,"text":"특정 종목 커뮤니티 게시글의 추천 수","correct":false},{"no":3,"text":"최근 하루 동안의 주가 등락률 하나","correct":false},{"no":4,"text":"지인의 매수 추천 여부","correct":false}]},{"num":8,"level":"초급","category":"주식 기본 개념","category_code":"BEGINNER_STOCK_BASIC","detail_code":"STOCK","question_type":"MULTIPLE_CHOICE","question_text":"주식 투자의 위험 요인으로 가장 적절한 것은?","explanation":"주식은 예금자보호 대상이 아니며 원금이 보장되지 않는다. 기업 실적과 시장 상황에 따라 주가가 하락하면 투자자는 손실을 볼 수 있다.","reward":1000,"choices":[{"no":1,"text":"기업 실적 악화나 시장 상황에 따라 주가가 하락해 원금 손실이 발생할 수 있다","correct":true},{"no":2,"text":"주식은 예금자보호 대상이라 원금 손실이 없다","correct":false},{"no":3,"text":"주식은 만기가 있어 만기에는 항상 원금이 보장된다","correct":false},{"no":4,"text":"주식 투자 손실은 국가가 보전해 준다","correct":false}]},{"num":9,"level":"초급","category":"주식 기본 개념","category_code":"BEGINNER_STOCK_BASIC","detail_code":"STOCK","question_type":"MULTIPLE_CHOICE","question_text":"배당을 지급하는 회사가 배당을 지급하지 않는 회사보다 항상 더 나은 투자 대상이라고 볼 수 없는 이유는?","explanation":"배당은 기업가치를 판단하는 여러 요소 중 하나에 불과하다. 성장성이 높은 기업은 배당 대신 재투자를 선택하기도 하므로 배당 지급 여부만으로 우열을 가릴 수 없다.","reward":1000,"choices":[{"no":1,"text":"기업가치는 배당뿐 아니라 성장성, 수익성, 재무 안정성 등을 함께 봐야 하기 때문","correct":true},{"no":2,"text":"배당을 주는 회사는 부도 위험이 전혀 없기 때문","correct":false},{"no":3,"text":"배당을 주지 않는 회사는 상장폐지 대상이기 때문","correct":false},{"no":4,"text":"배당 지급 여부는 주가와 아무 관련이 없기 때문","correct":false}]},{"num":10,"level":"초급","category":"주식 기본 개념","category_code":"BEGINNER_STOCK_BASIC","detail_code":"STOCK","question_type":"MULTIPLE_CHOICE","question_text":"주식에 대한 설명으로 가장 적절한 것은?","explanation":"주식은 저축이나 채권과 달리 원금이나 수익을 보장하지 않는 소유권 증권이다. 회사 성과에 따라 주주가 이익과 손실을 함께 부담하는 구조임을 이해해야 한다.","reward":1000,"choices":[{"no":1,"text":"주식은 기업 소유권을 나타내는 증권으로, 가격 변동에 따른 이익과 손실을 주주가 함께 부담한다","correct":true},{"no":2,"text":"주식은 원금과 수익이 보장되는 저축 상품이다","correct":false},{"no":3,"text":"주식 보유자는 회사가 손실을 보더라도 이를 부담하지 않는다","correct":false},{"no":4,"text":"주식은 만기일에 발행가 그대로 되돌려 받을 수 있는 상품이다","correct":false}]},{"num":11,"level":"초급","category":"주식 기본 개념","category_code":"BEGINNER_STOCK_BASIC","detail_code":"STOCK_PRICE","question_type":"MULTIPLE_CHOICE","question_text":"주가의 의미로 가장 적절한 것은?","explanation":"주가는 시장에서 거래되는 주식 한 주의 가격으로, 실적과 기대감, 수급, 시장 분위기의 영향을 함께 받는다.","reward":1000,"choices":[{"no":1,"text":"배당금","correct":false},{"no":2,"text":"시장에서 거래되는 주식 한 주의 가격","correct":true},{"no":3,"text":"시가총액","correct":false},{"no":4,"text":"거래량","correct":false}]},{"num":12,"level":"초급","category":"주식 기본 개념","category_code":"BEGINNER_STOCK_BASIC","detail_code":"STOCK_PRICE","question_type":"MULTIPLE_CHOICE","question_text":"주가와 시가총액의 관계를 옳게 설명한 것은?","explanation":"시가총액은 주가에 발행주식 수를 곱해 산출한다. 주가가 낮은 종목이라도 발행주식 수가 많으면 시가총액은 더 클 수 있어, 주가만으로 기업 규모를 비교할 수 없다.","reward":1000,"choices":[{"no":1,"text" "no":3,"text":"거래량 증가는 항상 기업 실적 개선을 의미하기 때문","correct":false},{"no":4,"text":"거래량과 주가는 같은 계산식으로 산출되기 때문","correct":false}]},{"num":51,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"PER_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"PER의 의미로 가장 적절한 것은?","explanation":"PER은 주가를 주당순이익(EPS)으로 나눈 주가수익비율로, 이익 대비 주가 수준을 나타낸다. 업종 평균, 성장성과 함께 비교해야 의미가 있다.","reward":1000,"choices":[{"no":1,"text":"EPS","correct":false},{"no":2,"text":"주가를 주당순이익(EPS)으로 나눈 주가수익비율","correct":true},{"no":3,"text":"PBR","correct":false},{"no":4,"text":"ROE","correct":false}]},{"num":52,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"PER_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"A기업의 주가는 20,000원, EPS는 2,000원이다. PER은 얼마인가?","explanation":"PER은 주가를 EPS로 나눠 구한다. 20,000원을 2,000원으로 나누면 10배가 된다.","reward":1000,"choices":[{"no":1,"text":"10배","correct":true},{"no":2,"text":"20배","correct":false},{"no":3,"text":"5배","correct":false},{"no":4,"text":"2배","correct":false}]},{"num":53,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"PER_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"PER이 낮다고 해서 항상 저평가로 볼 수 없는 이유로 가장 적절한 것은?","explanation":"PER은 주가 수준과 이익을 함께 반영하므로, 이익이 줄어 EPS가 낮아지면 PER도 낮게 계산될 수 있다. 업종 평균과 이익의 지속 가능성을 함께 확인해야 한다.","reward":1000,"choices":[{"no":1,"text":"이익 감소로 EPS가 줄어들면 PER이 낮아 보여도 이익의 지속 가능성이 떨어질 수 있기 때문","correct":true},{"no":2,"text":"PER은 업종과 무관하게 항상 동일한 기준으로 해석되기 때문","correct":false},{"no":3,"text":"PER이 낮으면 성장성도 항상 높기 때문","correct":false},{"no":4,"text":"PER은 이익과 무관하게 결정되는 지표이기 때문","correct":false}]},{"num":54,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"PER_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"PER과 PBR의 차이로 옳은 것은?","explanation":"PER은 주당순이익(EPS), PBR은 주당순자산(BPS)을 기준으로 각각 계산되는 별개의 지표다. 두 지표가 항상 같은 결론을 주는 것은 아니다.","reward":1000,"choices":[{"no":1,"text": ,"question_text":"PER에 대한 설명 중 옳지 않은 것은?","explanation":"PER이 같아도 성장성, 재무구조, 업종 특성에 따라 위험도는 크게 다를 수 있다. PER은 여러 판단 지표 중 하나로 활용해야 한다.","reward":1000,"choices":[{"no":1,"text":"PER은 주가를 EPS로 나눠 구한다","correct":false},{"no":2,"text":"PER은 업종별로 평균 수준이 다를 수 있다","correct":false},{"no":3,"text":"PER이 같으면 두 기업의 성장성과 위험도 항상 동일하다","correct":true},{"no":4,"text":"일회성 이익은 PER 해석을 왜곡할 수 있다","correct":false}]},{"num":63,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"PER_BASIC","question_type":"OX","question_text":"PER을 해석할 때 기준 기간이나 업종을 확인하는 것이 좋다.","explanation":"맞다. PER의 적정 수준은 업종과 성장 단계에 따라 다르므로 기준을 함께 확인해야 한다.","reward":1000,"choices":[{"no":1,"text":"O","correct":true},{"no":2,"text":"X","correct":false}]},{"num":64,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"ROE_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"ROE의 의미로 가장 적절한 것은?","explanation":"ROE는 기업이 자기자본을 활용해 얼마나 이익을 냈는지 보여주는 수익성 지표다. 부채비율에 따라 값이 왜곡될 수 있어 재무구조와 함께 봐야 한다.","reward":1000,"choices":[{"no":1,"text":"기업이 자기자본을 활용해 얼마나 이익을 냈는지를 보여주는 수익성 지표","correct":true},{"no":2,"text":"PER","correct":false},{"no":3,"text":"PBR","correct":false},{"no":4,"text":"EPS","correct":false}]},{"num":65,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"ROE_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"자기자본이 10억 원인 기업이 당기순이익 1억 원을 냈다면 ROE는?","explanation":"ROE는 당기순이익을 자기자본으로 나눠 구한다. 1억 원을 10억 원으로 나누면 10%다.","reward":1000,"choices":[{"no":1,"text":"10%","correct":true},{"no":2,"text":"1%","correct":false},{"no":3,"text":"100%","correct":false},{"no":4,"text":"0.1%","correct":false}]},{"num":66,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"ROE_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"높은 ROE가 항상 우수한 수익성을 의미하지 않는 이유로 가장 적절한 것은?","explanation":"ROE는 자기자본 대비 이익을 보여주므로, 부채를 늘려 자기자본 비중을 줄이면 이익 증가 없이도 ROE가 높아질 수 있다. 부채비율을 함께 확인해야 한다.","reward":1000,"choices":[{"no":1,"text":"부채를 늘려 자기자본을 줄이면 이익이 그대로여도 ROE가 높아질 수 있기 때문","correct":true},{"no":2,"text":"ROE는 부채와 전혀 관련이 없는 지표이기 때문","correct":false},{"no":3,"text":"ROE가 높으면 부채가 항상 낮다는 뜻이기 때문","correct":false},{"no":4,"text":"ROE는 업종에 관계없이 항상 같은 의미를 가지기 때문","correct":false}]},{"num":67,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"ROE_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"ROE와 PER을 구분한 설명으로 옳은 것은?","explanation":"ROE는 수익성을, PER은 가격 수준을 나타내는 서로 다른 지표로, 두 지표가 항상 같은 방향으로 움직이는 것은 아니다.","reward":1000,"choices":[{"no":1,"text":"ROE는 자기자본 대비 수익성을, PER은 이익 대비 주가 수준을 보여주는 서로 다른 지표다","correct":true},{"no":2,"text":"ROE와 PER은 동일한 개념을 다른 이름으로 부르는 것이다","correct":false},{"no":3,"text":"ROE가 높으면 PER은 항상 낮아진다","correct":false},{"no":4,"text":"PER만 알면 ROE는 계산할 필요가 없다","correct":false}]},{"num":68,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"ROE_BASIC","question_type":"OX","question_text":"ROE는 기업이 자기자본을 활용해 얼마나 이익을 냈는지를 보여주는 수익성 지표이다.","explanation":"맞다. ROE가 높을수록 자기자본을 효율적으로 활용해 이익을 냈다고 볼 수 있다.","reward":1000,"choices":[{"no":1,"text":"O","correct":true},{"no":2,"text":"X","correct":false}]},{"num":69,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"ROE_BASIC","question_type":"OX","question_text":"ROE가 높으면 부채 수준과 관계없이 항상 우량한 기업이다.","explanation":"틀리다. 부채를 크게 늘려 ROE가 일시적으로 높아진 경우일 수 있어 재무구조를 함께 확인해야 한다.","reward":1000,"choices":[{"no":1,"text":"O","correct":false},{"no":2,"text":"X","correct":true}]},{"num":70,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"ROE_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"C기업의 ROE는 20%로 매우 높지만 최근 부채비율이 크게 상승했다. 가장 적절한 확인은?","explanation":"ROE는 부채 활용도가 커지면 함께 높아질 수 있는 지표다. 수익성 개선인지 레버리지 효과인지 재무구조를 통해 확인해야 한다.","reward":1000,"choices":[{"no":1,"text":"높은 ROE가 이익 개선이 아니라 부채 확대에 따른 레버리지 효과인지 확인한다","correct":true},{"no":2,"text":"ROE가 높으므로 부채비율은 확인할 필요가 없다","correct":false},{"no":3,"text":"부채비율 상승은 ROE와 전혀 관계가 없다","correct":false},{"no":4,"text":"ROE가 높으면 재무 위험은 자동으로 낮아진다","correct":false}]},{"num":71,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"ROE_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"D기업은 올해 자산을 매각한 일회성 이익 덕분에 ROE가 크게 상승했다. 가장 적절한 해석은?","explanation":"자산 매각 같은 일회성 이익은 그해 ROE를 높이지만 반복되지 않는다. 본업에서 나온 이익인지 구분해 지속 가능성을 판단해야 한다.","reward":1000,"choices":[{"no":1,"text":"일회성 이익이 반영된 ROE는 다음 해에도 유지되기 어려울 수 있어 본업 이익 기준으로 다시 확인해야 한다","correct":true},{"no":2,"text":"ROE가 상승했으므로 내년에도 같은 수준이 유지된다고 본다","correct":false},{"no":3,"text":"일회성 이익은 ROE 계산에 영향을 주지 않는다","correct":false},{"no":4,"text":"ROE가 오르면 무조건 주가도 함께 오른다","correct":false}]},{"num":72,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"ROE_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"ROE만으로 기업의 수익성을 판단하기 어려울 때 추가로 확인하면 좋은 정보는?","explanation":"ROE는 부채비율과 이익의 질에 따라 왜곡될 수 있으므로, 재무구조와 이익의 원천을 함께 확인해야 한다.","reward":1000,"choices":[{"no":1,"text":"부채비율, 이익의 원천(본업 vs 일회성), 업종 평균 ROE","correct":true},{"no":2,"text":"회사 창립기념일","correct":false},{"no":3,"text":"최근 하루 주가 등락률 하나","correct":false},{"no":4,"text":"대표이사의 개인 SNS 게시물","correct":false}]},{"num":73,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"ROE_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"ROE에 대한 설명 중 옳지 않은 것은?","explanation":"업종 평균보다 높은 ROE도 부채나 일회성 이익의 영향을 받을 수 있어 저위험을 보장하지 않는다. 원인을 함께 확인해야 한다.","reward":1000,"choices":[{"no":1,"text":"ROE는 자기자본 대비 이익을 나타낸다","correct":false},{"no":2,"text":"부채비율이 높아지면 ROE가 함께 높아질 수 있다","correct":false},{"no":3,"text":"ROE가 업종 평균보다 높으면 어떤 경우에도 저위험 고수익 기업이다","correct":true},{"no":4,"text":"일회성 이익은 ROE를 일시적으로 높일 수 있다","correct":false}]},{"num":74,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"ROE_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"ROE 해석의 한계로 가장 적절한 것은?","explanation":"ROE는 유용한 수익성 지표지만 부채 구조와 이익의 질에 따라 왜곡될 수 있다. 원인을 함께 파악해야 올바르게 해석할 수 있다.","reward":1000,"choices":[{"no":1,"text":"ROE는 부채 활용도와 일회성 이익의 영향을 받을 수 있어 그 원인까지 함께 봐야 한다","correct":true},{"no":2,"text":"ROE는 어떤 경우에도 기업의 진짜 수익성만을 정확히 보여준다","correct":false},{"no":3,"text":"ROE는 부채와 전혀 상관없이 계산되는 지표다","correct":false},{"no":4,"text":"ROE가 높으면 주가는 항상 상승한다","correct":false}]},{"num":75,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"ROE_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"E기업과 F기업의 ROE가 똑같이 15%다. E기업은 부채비율이 낮고 F기업은 부채비율이 매우 높다면?","explanation":"ROE 수치가 같아도 그 이익이 어떻게 만들어졌는지는 다를 수 있다. 부채비율이 높은 기업은 레버리지에 의한 수익성 확대일 가능성을 함께 살펴야 한다.","reward":1000,"choices":[{"no":1,"text":"같은 ROE라도 F기업의 수익성은 레버리지 효과에 더 의존했을 가능성이 있어 재무 안정성 측면에서 차이가 있다","correct":true},{"no":2,"text":"두 기업의 재무 위험은 완전히 동일하다","correct":false},{"no":3,"text":"부채비율은 ROE 해석과 무관하므로 무시해도 된다","correct":false},{"no":4,"text":"ROE가 같으므로 어느 기업에 투자해도 결과는 같다","correct":false}]},{"num":76,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"ROE_BASIC","question_type":"OX","question_text":"ROE를 해석할 때 부채비율과 이익의 지속 가능성을 함께 확인하는 것이 좋다.","explanation":"맞다. ROE는 부채 구조와 이익의 질에 따라 달라질 수 있어 함께 확인해야 한다.","reward":1000,"choices":[{"no":1,"text":"O","correct":true},{"no":2,"text":"X","correct":false}]},{"num":77,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"EPS_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"EPS의 의미로 가장 적절한 것은?","explanation":"EPS는 기업의 순이익을 가중평균 유통보통주식 수로 나눈 주당 이익 지표로, PER 계산의 기준이 되는 값이다.","reward":1000,"choices":[{"no":1,"text":"PER","correct":false},{"no":2,"text":"ROE","correct":false},{"no":3,"text":"PBR","correct":false},{"no":4,"text":"기업의 이익을 일정 기간의 가중평균 유통보통주식 수로 나누어 주당 이익 수준을 나타낸 지표","correct":true}]},{"num":78,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"EPS_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"당기순이익이 50억 원이고 유통주식 수가 100만 주라면 EPS는?","explanation":"EPS는 순이익을 유통주식 수로 나눠 구한다. 50억 원을 100만 주로 나누면 5,000원이다.","reward":1000,"choices":[{"no":1,"text":"5,000원","correct":true},{"no":2,"text":"500원","correct":false},{"no":3,"text":"50,000원","correct":false},{"no":4,"text":"50원","correct":false}]},{"num":79,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"EPS_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"EPS가 증가했다고 해서 항상 기업의 본질적인 수익력이 좋아진 것은 아닌 이유는?","explanation":"EPS는 일회성 이익이 포함되면 일시적으로 늘어날 수 있다. 본업에서 반복적으로 나오는 이익인지 확인해야 지속 가능성을 판단할 수 있다.","reward":1000,"choices":[{"no":1,"text":"자산 매각 등 일회성 이익으로 EPS가 일시적으로 늘었을 수 있기 때문","correct":true},{"no":2,"text":"EPS는 항상 순수하게 영업활동에서만 발생하기 때문","correct":false},{"no":3,"text":"EPS 증가는 발행주식 수와 전혀 관계가 없기 때문","correct":false},{"no":4,"text":"EPS는 매 분기 동일한 값을 유지하는 지표이기 때문","correct":false}]},{"num":80,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"EPS_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"EPS와 PER의 관계로 옳은 것은?","explanation":"PER은 주가를 EPS로 나눈 값이므로 EPS가 변하면 PER도 함께 달라진다. EPS 감소는 PER을 높이는 방향으로 작용할 수 있다.","reward":1000,"choices":[{"no":1,"text":"EPS가 감소하면 주가가 그대로여도 PER은 높아질 수 있어 두 지표는 서로 연결되어 있다","correct":true},{"no":2,"text":"EPS와 PER은 서로 완전히 독립적이라 아무 관계가 없다","correct":false},{"no":3,"text":"EPS가 늘면 PER도 항상 함께 늘어난다","correct":false},{"no":4,"text":"EPS는 PER을 계산할 때 사용되지 않는다","correct":false}]},{"num":81,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"EPS_BASIC","question_type":"OX","question_text":"EPS는 기업의 이익을 일정 기간의 가중평균 유통보통주식 수로 나누어 주당 이익 수준을 나타낸 지표이다.","explanation":"맞다. 기본 EPS는 단순 발행주식 수가 아니라 가중평균 유통보통주식 수를 기준으로 계산한다.","reward":1000,"choices":[{"no":1,"text":"O","correct":true},{"no":2,"text":"X","correct":false}]},{"num":82,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"EPS_BASIC","question_type":"OX","question_text":"EPS가 늘어난 원인이 무엇인지 확인하지 않아도 항상 좋은 신호로 해석할 수 있다.","explanation":"틀리다. 일회성 이익이나 자사주 매입에 따른 주식 수 감소 등으로도 EPS가 늘어날 수 있어 원인을 확인해야 한다.","reward":1000,"choices":[{"no":1,"text":"O","correct":false},{"no":2,"text":"X","correct":true}]},{"num":83,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"EPS_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"G기업은 이익 증가 없이 자사주를 매입해 소각했는데 EPS가 늘었다. 가장 적절한 해석은?","explanation":"EPS는 이익뿐 아니라 유통주식 수에도 영향을 받는다. 자사주 매입·소각으로 주식 수가 줄면 이익이 그대로여도 EPS는 늘어날 수 있다.","reward":1000,"choices":[{"no":1,"text":"유통주식 수가 줄어든 효과로 EPS가 늘어난 것이므로 본업 이익 증가와 구분해서 봐야 한다","correct":true},{"no":2,"text":"EPS가 늘었으므로 본업 수익성이 개선된 것이 확실하다","correct":false},{"no":3,"text":"자사주 매입은 EPS 계산에 영향을 주지 않는다","correct":false},{"no":4,"text":"EPS 증가는 항상 매출 증가를 의미한다","correct":false}]},{"num":84,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"EPS_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"H기업의 EPS가 전년보다 크게 늘었는데, 그중 대부분이 보유 부동산 매각 이익이었다. 적절한 판단은?","explanation":"부동산 매각 같은 일회성 이익은 반복되지 않는다. EPS 증가가 본업에서 나온 것인지 구분해야 이익의 질을 제대로 평가할 수 있다.","reward":1000,"choices":[{"no":1,"text":"일회성 이익을 제외한 본업 이익 기준으로 EPS 증가의 지속 가능성을 다시 확인한다","correct":true},{"no":2,"text":"EPS가 늘었으므로 다음 해에도 같은 수준의 EPS가 반복된다","correct":false},{"no":3,"text":"부동산 매각 이익도 본업 이익과 동일하게 취급한다","correct":false},{"no":4,"text":"EPS 증가율이 높을수록 항상 저PER로 이어진다","correct":false}]},{"num":85,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"EPS_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"EPS 증가율만 보고 투자 판단을 내리기 전에 추가로 확인하면 좋은 정보는?","explanation":"EPS는 이익뿐 아니라 유통주식 수 변화에도 영향을 받는다. 증가 원인이 본업 이익인지, 일회성 요인인지 함께 확인해야 한다.","reward":1000,"choices":[{"no":1,"text":"이익 증가가 본업에서 발생했는지, 유통주식 수 변화가 있었는지 여부","correct":true},{"no":2,"text":"회사 웹사이트의 디자인","correct":false},{"no":3,"text":"최근 하루 시가와 종가 차이 하나","correct":false},{"no":4,"text":"회사명의 알파벳 순서","correct":false}]},{"num":86,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"EPS_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"EPS에 대한 설명 중 옳지 않은 것은?","explanation":"EPS 증가의 원인이 본업 이익인지 일회성 요인인지에 따라 해석이 달라진다. 원인을 확인하지 않고 판단하면 이익의 질을 놓칠 수 있다.","reward":1000,"choices":[{"no":1,"text":"EPS는 순이익을 유통주식 수로 나눠 구한다","correct":false},{"no":2,"text":"자사주 매입·소각은 EPS에 영향을 줄 수 있다","correct":false},{"no":3,"text":"EPS가 늘어난 원인은 확인할 필요 없이 무조건 긍정적으로 해석한다","correct":true},{"no":4,"text":"일회성 이익은 EPS를 일시적으로 늘릴 수 있다","correct":false}]},{"num":87,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"EPS_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"EPS 해석의 한계로 가장 적절한 것은?","explanation":"EPS는 유용한 지표지만 일회성 이익이나 주식 수 변화에 따라 실제 수익력과 다르게 나타날 수 있다. 이익의 원천을 함께 확인해야 한다.","reward":1000,"choices":[{"no":1,"text":"EPS는 일회성 이익이나 자사주 매입 등으로 왜곡될 수 있어 이익의 질을 함께 살펴야 한다","correct":true},{"no":2,"text":"EPS는 어떤 상황에서도 기업의 본질적인 수익력만을 정확히 보여준다","correct":false},{"no":3,"text":"EPS는 유통주식 수와 관계없이 항상 동일하게 계산된다","correct":false},{"no":4,"text":"EPS가 늘면 배당도 항상 같은 비율로 늘어난다","correct":false}]},{"num":88,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"EPS_BASIC","question_type":"OX","question_text":"EPS를 해석할 때 이익 증가의 원인과 유통주식 수 변화를 함께 확인하는 것이 좋다.","explanation":"맞다. EPS는 이익과 유통주식 수 모두의 영향을 받으므로 원인을 함께 살펴야 한다.","reward":1000,"choices":[{"no":1,"text":"O","correct":true},{"no":2,"text":"X","correct":false}]},{"num":89,"level":"초급","category":"재무지표 기초","category_code":"BEGINNER_FINANCIAL_BASIC","detail_code":"PBR_BASIC","question_type":"MULTIPLE_CHOICE","question_text":"PBR의 의미로 가장 적절한 것은?","explanation":"PBR은 주가를 주당순자산(BPS)으로 나눈 주가순자산비율로, 자산 대비 주가 수준을 나타낸다. 자산의 질과 수익성도 함께 확인해야 한다.","reward":1000,"choices":[{"no":1,"text":"PER","correct":false},{"no":2,"text":"ROE","correct":false},{"no":3,"text":"EPS","correct":false},{"no":4,"text":"주가를 주당순자산(BPS const list=document.getElementById('list'),search=document.getElementById('search'),level=document.getElementById('level'),category=document.getElementById('category'),count=document.getElementById('count'),allAnswers=document.getElementById('allAnswers');
let showAll=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
 const t=search.value.trim().toLowerCase(),lv=level.value,cat=category.value;
 const f=qs.filter(q=>(!lv||q.level===lv)&&(!cat||q.category_code===cat)&&(!t||[q.question_text,q.explanation,q.category,q.detail_code,...q.choices.map(c=>c.text)].join(' ').toLowerCase().includes(t)));
 count.textContent=`표시 ${f.length} / 900`;
 if(!f.length){list.innerHTML='<div class="empty">조건에 맞는 문제가 없습니다.</div>';return}
 list.innerHTML=f.map(q=>{
   const ans=q.choices.find(c=>c.correct);
   const choices=q.choices.map(c=>`<div class="choice ${c.correct?'correct':''}"><b>${c.no}.</b> ${esc(c.text)}</div>`).join('');
   return `<section class="card ${showAll?'show':''}">
   <div class="meta"><span>#${String(q.num).padStart(4,'0')}</span><span>${esc(q.level)}</span><span>${esc(q.category)}</span><span>${esc(q.detail_code)}</span><span>${esc(q.question_type)}</span></div>
   <div class="q">${esc(q.question_text)}</div>${choices}
   <div class="actions"><button onclick="this.closest('.card').classList.toggle('show')">정답/해설 보기</button></div>
   <div class="answer"><b>정답:</b> ${ans.no}. ${esc(ans.text)}<br><b>해설:</b> ${esc(q.explanation)}</div></section>`;
 }).join('');
}
search.addEventListener('input',render);level.addEventListener('change',render);category.addEventListener('change',render);
allAnswers.addEventListener('click',()=>{showAll=!showAll;allAnswers.textContent=showAll?'정답 모두 숨기기':'정답 모두 보기';render()});
render();
</script>
